# Integración continua: pruebas unitarias, lint y APK en cada push y Pull Request.
name: CI

on:
  push:
    branches: [main, 'release/**', 'feature-**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (pruebas, lint y APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias y APK
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Lint (informativo)
        continue-on-error: true
        run: bash ./gradlew --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados
          path: |
            app/build/test-results/
            app/build/reports/
