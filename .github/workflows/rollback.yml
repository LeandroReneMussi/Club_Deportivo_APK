# Rollback de código (doc/VERSIONADO_Y_ROLLBACK.md): abre un Pull Request hacia main que devuelve el
# contenido del repositorio al de una versión publicada. Se aprueba como cualquier cambio a main (4 ojos);
# al hacer merge, el workflow Release publica una nueva versión de parche con ese contenido.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión publicada a restaurar (ej. v1.2.0)'
        required: true
      motivo:
        description: 'Motivo del rollback'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preparar la rama de rollback
        env:
          TAG: ${{ inputs.version }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "No existe la versión $TAG"; exit 1; }
          rama="rollback/$TAG-$(date +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$rama"
          git rm -rq .
          git checkout "$TAG" -- .
          git commit -m "Rollback a $TAG" -m "Motivo: $MOTIVO"
          git push origin "$rama"
          echo "RAMA=$rama" >> "$GITHUB_ENV"
      - name: Abrir el Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          gh pr create --base main --head "$RAMA" --title "Rollback a $TAG" \
            --body "Restaura el contenido de $TAG. Motivo: $MOTIVO. Requiere aprobación de un integrante distinto del autor."
